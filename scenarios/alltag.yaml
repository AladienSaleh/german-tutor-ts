id: alltag
title: Daily Life (Alltag)
description: Practicing basic daily routines and personal information.
points:
  - Greet the student and ask their name.
  - Ask where they live.
  - Ask what time they wake up.
  - Ask what they eat for breakfast.
  - Ask about their job or studies.
  - Ask what they do in their free time.
  - Ask about their family.
  - Ask what they did yesterday (introduces simple past).
  - Wrap up warmly and tell them they did well.
